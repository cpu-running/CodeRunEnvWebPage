<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python 在线运行环境 v3.1</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
<style>
:root{
  --bg:#12141a; --panel:#191c24; --panel2:#20242e; --line:#2b3040;
  --fg:#dfe3ec; --dim:#8b93a7; --accent:#4ea1ff; --ok:#57d38c; --err:#ff6b6b; --warn:#ffc857;
  --mono:"SFMono-Regular",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
}
html[data-theme="light"]{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#eef1f6; --line:#d8dde7;
  --fg:#1d2230; --dim:#6b7385; --accent:#1a6fd4; --ok:#1a9c5b; --err:#d63b3b; --warn:#b8860b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
/* ---------- 工具栏 ---------- */
header{
  flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{font-weight:700;letter-spacing:.3px;margin-right:4px}
.brand small{font-weight:400;color:var(--dim);margin-left:6px}
button,select,input,textarea{font-family:inherit;font-size:13px;color:var(--fg)}
button{
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:6px 12px;cursor:pointer;transition:.15s;
}
button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
button.danger:hover:not(:disabled){border-color:var(--err);color:var(--err)}
input[type=text],select,textarea{
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;outline:none;
}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent)}
.spacer{flex:1}
#status{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;min-width:180px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:0 0 auto}
.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}.dot.run{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
/* ---------- 加载进度 ---------- */
#loadWrap{flex:0 0 auto;height:3px;background:var(--panel2);overflow:hidden;display:none}
#loadWrap.on{display:block}
#loadWrap.ind #loadBar{width:35% !important;animation:slide 1.2s ease-in-out infinite}
#loadBar{height:100%;width:0;background:var(--accent);transition:width .2s}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
/* ---------- 主体 ---------- */
main{flex:1 1 auto;display:flex;min-height:0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
#left{flex:1 1 58%}
#splitter{flex:0 0 6px;cursor:col-resize;background:var(--line);transition:.15s}
#splitter:hover{background:var(--accent)}
#right{flex:1 1 42%}
.pane-head{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px;
  font-size:12px;color:var(--dim);background:var(--panel);border-bottom:1px solid var(--line);
}
#editorWrap{flex:1 1 auto;overflow:hidden;position:relative;background:var(--panel)}
.CodeMirror{height:100%;font-family:var(--mono);font-size:14px;line-height:1.6}
#fallbackEditor{
  position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:none;padding:12px;
  background:var(--panel);color:var(--fg);font-family:var(--mono);font-size:14px;line-height:1.6;
}
/* ---------- 输出 ---------- */
#output{
  flex:1 1 auto;overflow:auto;padding:10px 12px;background:var(--bg);
  font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
}
#output .o-line{min-height:1.55em}
#output .o-line span{white-space:pre-wrap}
#output .o-stdout{color:var(--fg)}
#output .o-stderr{color:var(--err)}
#output .o-echo{color:var(--dim)}
#output .o-err{color:var(--err);white-space:pre-wrap}
#output .o-ret{color:var(--ok)}
#output .o-sys{color:var(--accent)}
#output img{max-width:100%;border-radius:6px;border:1px solid var(--line);margin:6px 0;background:#fff}
#output hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
#output .o-omit{color:var(--dim);font-size:12px}
/* ---------- 输入区 ---------- */
footer{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:6px 10px}
.stdin-row{display:flex;gap:8px;align-items:center}
.stdin-row .tag{font-size:12px;color:var(--dim);flex:0 0 auto}
#stdinPrompt{font-family:var(--mono);color:var(--warn);flex:0 0 auto;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stdinInput{flex:1 1 auto;font-family:var(--mono)}
#stdinPrefill{width:100%;height:64px;min-height:52px;font-family:var(--mono);resize:vertical;display:block}
.hidden{display:none !important}
/* ---------- 设置 ---------- */
#settings{
  flex:0 0 auto;display:none;gap:10px;flex-wrap:wrap;align-items:center;
  padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--dim);
}
#settings.open{display:flex}
#settings label{display:flex;gap:6px;align-items:center}
#settings input[type=text]{min-width:280px;font-family:var(--mono);font-size:12px}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:11px}
@media (max-width:820px){
  main{flex-direction:column}
  #splitter{display:none}
  #left,#right{flex:1 1 50%}
  .brand small{display:none}
}
</style>

<!-- ===================== Worker：Pyodide 运行时 ===================== -->
<script id="worker-src" type="javascript/worker">
let pyodide = null;
let interruptBuf = null;
let ctrl = null;      // Int32Array 视图：[0]=状态 0等待/1有数据/2 EOF/3 中断, [1]=字节长度
let sabBytes = null;  // Uint8Array 视图，数据区从偏移 16 开始
let queue = [];       // 无 SharedArrayBuffer 时的预填队列
const decoder = new TextDecoder("utf-8");
const encoder = new TextEncoder();

function post(msg) { self.postMessage(msg); }
function out(stream, text) { post({ type: "out", stream: stream, text: text }); }

/* 字节级输出处理器：streaming 解码，UTF-8 多字节跨块也不会乱码，
   且 print() 写入的 "\\n" 一定会被送到主线程（batched 模式依赖行缓冲，容易丢末尾换行） */
function makeStreamWriter(stream) {
  const dec = new TextDecoder("utf-8");
  return function (buf) {
    let text = "";
    try { text = dec.decode(buf, { stream: true }); }
    catch (e) { try { text = dec.decode(buf); } catch (e2) { text = ""; } }
    if (text) out(stream, text);
    return buf.length;
  };
}

/* ---- 阻塞式 stdin：在 Worker 线程里用 Atomics.wait 等待主线程送来输入 ---- */
function stdinHandler() {
  if (!ctrl) return queue.length ? queue.shift() : undefined;   // 降级：预填队列
  Atomics.store(ctrl, 0, 0);
  post({ type: "stdin_request" });
  while (Atomics.load(ctrl, 0) === 0) {
    Atomics.wait(ctrl, 0, 0, 1000);                              // 阻塞 worker，不冻结界面
    if (interruptBuf && Atomics.load(interruptBuf, 0) === 2) break;
  }
  const flag = Atomics.load(ctrl, 0);
  if (flag === 2) return undefined;                              // EOF → input() 抛 EOFError
  if (flag === 3) {                                              // 用户在等待输入时点了「停止」
    if (interruptBuf) Atomics.store(interruptBuf, 0, 2);
    return "";                                                   // 空行 + SIGINT → KeyboardInterrupt
  }
  const len = Atomics.load(ctrl, 1);
  return decoder.decode(sabBytes.subarray(16, 16 + len));
}

async function init(msg) {
  if (msg.stdinSAB) {
    ctrl = new Int32Array(msg.stdinSAB);
    sabBytes = new Uint8Array(msg.stdinSAB);
  }
  if (msg.interruptSAB) interruptBuf = new Int32Array(msg.interruptSAB);

  self.importScripts(msg.indexURL + "pyodide.js");
  pyodide = await loadPyodide({ indexURL: msg.indexURL });
  // 用字节级 write handler（而非按行的 batched），保证 print 末尾的 "\\n" 原样送达
  pyodide.setStdout({ write: makeStreamWriter("stdout") });
  pyodide.setStderr({ write: makeStreamWriter("stderr") });
  pyodide.setStdin({ stdin: stdinHandler, isatty: false, autoEOF: true });
  if (interruptBuf) pyodide.setInterruptBuffer(interruptBuf);

  // 供 Python 侧回调的宿主接口（图片 / HTML / 文件）
  pyodide.registerJsModule("pyide_host", {
    send_image: (b64) => post({ type: "image", data: b64 }),
    send_html: (html) => post({ type: "html", data: html }),
    send_file: (name, b64) => post({ type: "file", name: name, data: b64 }),
  });

  await pyodide.loadPackage(["micropip"]);
  pyodide.runPython(BOOTSTRAP);

  post({ type: "ready", version: pyodide.runPython("import sys; sys.version.split()[0]"), pyodide: pyodide.version });
}

/* 解析用户代码里 import 的第三方模块名（排除标准库与已加载模块） */
const BOOTSTRAP = `
import ast, sys, io, base64

# 非 tty 时 Python 默认块缓冲，print 会攒着不发 —— 改成行缓冲，一条 print 一次输出
for _s in (sys.stdout, sys.stderr):
    try:
        _s.reconfigure(line_buffering=True, encoding="utf-8")
    except Exception:
        pass

def _pyide_missing_modules(code):
    mods = set()
    try:
        tree = ast.parse(code)
    except SyntaxError:
        return []
    for node in ast.walk(tree):
        if isinstance(node, ast.Import):
            for a in node.names:
                mods.add(a.name.split(".")[0])
        elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
            mods.add(node.module.split(".")[0])
    std = getattr(sys, "stdlib_module_names", set())
    skip = {"micropip", "pyodide", "pyodide_js", "js", "pyide_host"}
    return sorted(m for m in mods if m and m not in std and m not in skip and m not in sys.modules)

def _pyide_patch_matplotlib():
    try:
        import matplotlib
        if matplotlib.get_backend().lower() != "agg":
            matplotlib.use("AGG")
        import matplotlib.pyplot as plt
        if getattr(plt, "_pyide_patched", False):
            return True
        import pyide_host
        def _show(*args, **kwargs):
            buf = io.BytesIO()
            plt.savefig(buf, format="png", dpi=110, bbox_inches="tight")
            buf.seek(0)
            pyide_host.send_image(base64.b64encode(buf.read()).decode("ascii"))
            plt.close("all")
        plt.show = _show
        plt._pyide_patched = True
        return True
    except Exception:
        return False

def show(obj=None, **kwargs):
    """在输出区显示图片（PIL.Image / 本地文件路径 / base64 字符串）"""
    import pyide_host
    try:
        from PIL import Image
        if isinstance(obj, Image.Image):
            buf = io.BytesIO(); obj.save(buf, format="PNG")
            pyide_host.send_image(base64.b64encode(buf.getvalue()).decode("ascii")); return
    except Exception:
        pass
    if isinstance(obj, str):
        try:
            with open(obj, "rb") as f:
                pyide_host.send_image(base64.b64encode(f.read()).decode("ascii")); return
        except Exception:
            pyide_host.send_html(obj)
`;

async function ensurePackages(code, mirror) {
  const missingFn = pyodide.globals.get("_pyide_missing_modules");
  let mods = [];
  try { mods = missingFn(code).toJs(); } catch (e) { mods = []; }
  missingFn.destroy && missingFn.destroy();
  const pip = [];
  for (const m of mods) {
    try {
      await pyodide.loadPackage(m, { messageCallback: (s) => post({ type: "status", text: s }) });
    } catch (e) { pip.push(m); }
  }
  if (pip.length) {
    post({ type: "status", text: "正在用 micropip 安装：" + pip.join(", ") });
    await pyodide.runPythonAsync(
      "import micropip\nawait micropip.install(" + JSON.stringify(pip) + ", index_urls=" + JSON.stringify([mirror]) + ")"
    );
  }
}

async function handleRun(msg) {
  queue = msg.stdinLines || [];
  if (interruptBuf) Atomics.store(interruptBuf, 0, 0);
  const t0 = Date.now();
  try {
    await ensurePackages(msg.code, msg.mirror);
    pyodide.runPython("_pyide_patch_matplotlib()");
    const result = await pyodide.runPythonAsync(msg.code);
    if (result !== undefined && result !== null) {
      pyodide.globals.set("_pyide_last", result);
      const rep = pyodide.runPython("repr(_pyide_last)");
      if (rep && rep !== "None") post({ type: "ret", text: rep });
    }
    pyodide.runPython(`
try:
    del _pyide_last
except Exception:
    pass`);
  } catch (e) {
    let text = (e && e.message) ? e.message : String(e);
    text = text.replace(/^PythonError:?\s*/i, "");
    if (/SystemExit/.test(text)) {
      post({ type: "sys", text: "程序调用了 exit() / quit()，内核已结束 —— 正在自动重启…（请改用 if __name__ 或 try 包裹）" });
      post({ type: "exit" });                      // 通知主线程重建内核，避免留下一个死内核
    }
    if (/KeyboardInterrupt/.test(text)) {
      post({ type: "sys", text: "已中断（KeyboardInterrupt）" });
    }
    post({ type: "error", text: text });
  } finally {
    post({ type: "done", ms: Date.now() - t0 });
  }
}

async function handleInstall(msg) {
  try {
    await pyodide.loadPackage("micropip");
    const names = msg.names;
    const res = await pyodide.runPythonAsync(
      "import micropip\nr = await micropip.install(" + JSON.stringify(names) + ", index_urls=" + JSON.stringify([msg.mirror]) + ")\nstr(r)"
    );
    post({ type: "sys", text: "✔ 已安装：" + names.join(", ") });
  } catch (e) {
    post({ type: "error", text: ((e && e.message) || String(e)).replace(/^PythonError:?\s*/i, "") });
  } finally {
    post({ type: "done", ms: 0 });
  }
}

self.onmessage = async (ev) => {
  const msg = ev.data;
  try {
    if (msg.type === "init") await init(msg);
    else if (msg.type === "run") await handleRun(msg);
    else if (msg.type === "install") await handleInstall(msg);
  } catch (e) {
    post({ type: "fatal", text: ((e && e.message) || String(e)) });
  }
};
</script>

<script>
const $ = (s) => document.querySelector(s);
const output = $("#output"), statusText = $("#statusText"), dot = $("#dot");
const runBtn = $("#runBtn"), stopBtn = $("#stopBtn");

const SOURCES = [
  { name: "jsDelivr v0.29.4（推荐）", url: "https://cdn.jsdelivr.net/pyodide/v0.29.4/full/" },
  { name: "fastly jsDelivr v0.29.4", url: "https://fastly.jsdelivr.net/pyodide/v0.29.4/full/" },
  { name: "jsDelivr v0.28.0", url: "https://cdn.jsdelivr.net/pyodide/v0.28.0/full/" },
  { name: "jsDelivr v0.26.4", url: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" },
  { name: "unpkg v0.29.4", url: "https://unpkg.com/pyodide@0.29.4/" },
  { name: "jsDelivr dev（最新测试版）", url: "https://cdn.jsdelivr.net/pyodide/dev/full/" },
];
const HAS_SAB = typeof SharedArrayBuffer === "function" && typeof Atomics === "object" && typeof Atomics.wait === "function";

let worker = null, ready = false, running = false, editor = null;
let stdinSAB = null, stdinCtrl = null, stdinBytes = null, interruptBuf = null;
let awaitingInput = false;
let runTimer = null;      // 运行超时看门狗
let forceTimer = null;    // 中断无响应后的强制重启定时器

/* ---------- 编辑器 ---------- */
function buildEditor() {
  const ta = $("#code");
  if (window.CodeMirror) {
    editor = CodeMirror.fromTextArea(ta, {
      mode: "python", theme: "monokai", lineNumbers: true, indentUnit: 4, tabSize: 4,
      indentWithTabs: false, autoCloseBrackets: true, matchBrackets: true,
      styleActiveLine: true, lineWrapping: false,
      extraKeys: {
        "Ctrl-Enter": () => runCode(), "Cmd-Enter": () => runCode(),
        "Ctrl-/": (cm) => cm.toggleComment(), "Cmd-/": (cm) => cm.toggleComment(),
        Tab: (cm) => (cm.somethingSelected() ? cm.indentSelection("add") : cm.replaceSelection("    ")),
      },
    });
  } else {
    ta.id = "fallbackEditor";
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Tab") { e.preventDefault(); const s = ta.selectionStart; ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 4; }
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runCode(); }
    });
  }
  const saved = localStorage.getItem("pyide.code");
  if (saved !== null) setCode(saved);
}
const getCode = () => (editor ? editor.getValue() : $("#code").value);
const setCode = (v) => (editor ? editor.setValue(v) : ($("#code").value = v));

/* ---------- 输出 ---------- */
/* 渲染模型：一行 = 一个块级 <div class="o-line">
   块级元素天然独占一行，不再依赖 white-space:pre-wrap 是否被浏览器正确应用，
   因此 print() 的自动换行、字符串里的显式 \n、以及空行都能稳定显示。
   v3.1：写入先进 DocumentFragment，由 requestAnimationFrame 批量插入 DOM；
   并限制 DOM 行数上限，避免上万次 print 把页面卡死。 */
const MAX_LINES = 2000;             // 输出区保留的最大行数
let omittedLines = 0;               // 累计被丢弃的行数
let frag = null;                    // 待批量插入的片段
let flushScheduled = false;
let stickBottom = true;             // 视口贴底时才自动滚动，不打断向上翻阅
const root = () => frag || output;
output.addEventListener("scroll", () => {
  stickBottom = output.scrollHeight - output.scrollTop - output.clientHeight < 40;
});
let curLine = null;                 // 当前正在写入的那一行
function ensureLine() {
  if (!curLine || curLine.parentNode !== root()) {
    curLine = document.createElement("div");
    curLine.className = "o-line";
    root().appendChild(curLine);
  }
  return curLine;
}
function closeLine() { curLine = null; }
/* 当前行已有内容时另起一行，避免不同来源的输出粘在一起 */
function ensureNewline() {
  if (curLine && curLine.childNodes.length) closeLine();
}
/* rAF 批量落盘：一次 render 插入成百上千行，而不是每行一次重排 */
function scheduleFlush() {
  if (flushScheduled) return;
  flushScheduled = true;
  requestAnimationFrame(flushNow);
}
function flushNow() {
  flushScheduled = false;
  if (frag && frag.childNodes.length) { output.appendChild(frag); frag = null; }
  enforceLimit();
  if (stickBottom) output.scrollTop = output.scrollHeight;
}
/* 行数超限：丢掉最前面的一批行，顶部保留一条可更新的省略提示 */
function enforceLimit() {
  const over = output.childElementCount - MAX_LINES;
  if (over <= 0) return;
  for (let i = 0; i < over; i++) output.removeChild(output.firstElementChild);
  omittedLines += over;
  let note = output.firstElementChild;
  if (!note || !note.dataset || note.dataset.omit !== "1") {
    note = document.createElement("div");
    note.className = "o-line"; note.dataset.omit = "1";
    output.insertBefore(note, output.firstChild);
  }
  note.textContent = "";
  const s = document.createElement("span");
  s.className = "o-omit";
  s.textContent = "… 已省略前 " + omittedLines + " 行（输出过长，仅保留最近 " + MAX_LINES + " 行）";
  note.appendChild(s);
}
function append(text, cls) {
  if (text === undefined || text === null || text === "") return;
  if (!frag) frag = document.createDocumentFragment();   // 先攒着，等 rAF 一次性插入
  const str = String(text).replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  const parts = str.split("\n");
  for (let i = 0; i < parts.length; i++) {
    ensureLine();                                   // 空段也占一行 → 空行能显示
    if (parts[i] !== "") {
      const span = document.createElement("span");
      span.className = cls || "o-stdout";
      span.style.whiteSpace = "pre-wrap";           // 兜底，防残留换行符
      span.textContent = parts[i];
      curLine.appendChild(span);
    }
    if (i < parts.length - 1) closeLine();          // 这一段后面跟着一个 \n
  }
  scheduleFlush();
}
function clearOutput() {
  output.innerHTML = "";
  frag = null; curLine = null; omittedLines = 0;
  stickBottom = true;
}
/* 运行结束时丢掉末尾那个「光标所在」的空行 */
function trimTrailingBlankLine() {
  flushNow();
  const last = output.lastElementChild;
  if (last && last.classList.contains("o-line") && last.childNodes.length === 0) {
    output.removeChild(last);
  }
  curLine = null;
}
function appendImage(b64) {
  flushNow();                       // 先落盘，保证图片与前后文字的顺序
  ensureNewline();
  const img = document.createElement("img");
  img.src = "data:image/png;base64," + b64;
  ensureLine();
  curLine.appendChild(img);
  closeLine();
  if (stickBottom) output.scrollTop = output.scrollHeight;
}
/* 把一个块级元素放进独立的一行 */
function appendBlock(el) {
  flushNow();
  ensureNewline();
  ensureLine();
  curLine.appendChild(el);
  closeLine();
  if (stickBottom) output.scrollTop = output.scrollHeight;
}
function setStatus(text, cls) {
  statusText.textContent = text;
  dot.className = "dot " + (cls || "");
}

/* ---------- 启动 Worker ---------- */
/* 探测顺序：并行 HEAD → 并行 Range GET（部分 CDN 不接受 HEAD）。
   串行探测时代，前几个源超时会白白等上十几秒；并行后只取最快的那个。 */
async function probeHead(url) {
  try {
    const r = await fetch(url + "pyodide.js", { method: "HEAD", mode: "cors", cache: "no-store" });
    return r.ok ? url : null;
  } catch (e) { return null; }
}
async function probeRange(url) {
  try {
    const r = await fetch(url + "pyodide.js", { mode: "cors", headers: { Range: "bytes=0-0" }, cache: "no-store" });
    return (r.ok || r.status === 206) ? url : null;
  } catch (e) { return null; }
}
async function pickSource() {
  const urls = SOURCES.map((s) => s.url);
  const hit = (await Promise.all(urls.map(probeHead))).find(Boolean);
  if (hit) return hit;
  return (await Promise.all(urls.map(probeRange))).find(Boolean) || null;
}

/* ---------- 运行时预加载：把几十 MB 的下载过程显示出来 ---------- */
const PRELOAD = ["pyodide.js", "pyodide-lock.json", "pyodide.asm.wasm", "python_stdlib.zip"];
const PRELOAD_BUDGET = 25000;                      // 预加载超过 25s 就放弃，直接启动
function setLoad(pct, text) {
  const w = $("#loadWrap"), b = $("#loadBar");
  if (pct === null) { w.classList.remove("on", "ind"); b.style.width = "0"; return; }
  w.classList.add("on");
  if (pct < 0) w.classList.add("ind");             // 总大小未知 → 往返动画
  else { w.classList.remove("ind"); b.style.width = Math.max(0, Math.min(100, pct)) + "%"; }
  if (text) setStatus(text, "run");
}
const mb = (n) => (n / 1048576).toFixed(1) + " MB";
async function preloadRuntime(indexURL) {
  const ac = new AbortController();
  const bail = setTimeout(() => ac.abort(), PRELOAD_BUDGET);
  try {
    const infos = await Promise.all(PRELOAD.map(async (f) => {
      try {
        const h = await fetch(indexURL + f, { method: "HEAD", mode: "cors", cache: "no-store", signal: ac.signal });
        return { f: f, len: h.ok ? (+h.headers.get("content-length") || 0) : 0 };
      } catch (e) { return { f: f, len: 0 }; }
    }));
    const total = infos.reduce((a, b) => a + b.len, 0);
    let done = 0;
    setLoad(total ? 0 : -1, "正在下载运行时…");
    for (const it of infos) {
      const res = await fetch(indexURL + it.f, { mode: "cors", signal: ac.signal });
      if (!res.ok || !res.body) continue;
      const reader = res.body.getReader();
      while (true) {
        const r = await reader.read();
        if (r.done) break;
        done += r.value.byteLength || 0;
        setLoad(total ? (done / total) * 100 : -1,
          total ? "正在下载运行时… " + mb(done) + " / " + mb(total) : "正在下载运行时… " + mb(done));
      }
    }
    setLoad(100, "运行时下载完成，正在初始化 Python…");
  } catch (e) {
    setLoad(-1, "预加载未完成，直接启动…");          // 失败不阻塞，交给 Worker 自己加载
  } finally {
    clearTimeout(bail);
  }
}

function spawnWorker(indexURL) {
  const src = document.getElementById("worker-src").textContent;
  const blob = new Blob([src], { type: "text/javascript" });
  worker = new Worker(URL.createObjectURL(blob));

  worker.onmessage = (ev) => {
    const m = ev.data;
    if (m.type === "ready") {
      ready = true;
      $("#pyver").textContent = "Python " + m.version + " · Pyodide " + m.pyodide;
      setLoad(null);
      setStatus("就绪", "ok");
      runBtn.disabled = false; $("#pkgBtn").disabled = false;
      append("Python " + m.version + "（Pyodide " + m.pyodide + "，WebAssembly）已就绪\n" +
        (HAS_SAB ? "交互输入：支持 · 停止：支持（SIGINT）\n"
                 : "交互输入：预填模式 · 停止：重启内核（当前环境无 SharedArrayBuffer）\n"), "o-sys");
      closeLine();
      output.appendChild(document.createElement("hr"));
    } else if (m.type === "out") {
      append(m.text, m.stream === "stderr" ? "o-stderr" : "o-stdout");
    } else if (m.type === "ret") {
      ensureNewline();
      append("⟶ " + m.text + "\n", "o-ret");
    } else if (m.type === "error") {
      ensureNewline();
      append(m.text + "\n", "o-err");
    } else if (m.type === "sys") {
      ensureNewline();
      append(m.text + "\n", "o-sys");
    } else if (m.type === "image") {
      appendImage(m.data);
    } else if (m.type === "html") {
      const d = document.createElement("div"); d.innerHTML = m.data; appendBlock(d);
    } else if (m.type === "file") {
      const a = document.createElement("a");
      a.href = "data:application/octet-stream;base64," + m.data; a.download = m.name;
      a.textContent = "⬇ 下载文件 " + m.name; a.style.color = "var(--accent)";
      appendBlock(a);
    } else if (m.type === "status") {
      setStatus(m.text, "run");
    } else if (m.type === "stdin_request") {
      awaitingInput = true;
      $("#stdinPrompt").textContent = "› 等待输入";
      $("#stdinInput").focus();
      setStatus("程序正在等待 input()", "run");
    } else if (m.type === "done") {
      running = false; awaitingInput = false;
      clearTimeout(runTimer); runTimer = null;
      clearTimeout(forceTimer); forceTimer = null;
      ensureNewline();            // print(..., end="") 这类没换行的收尾，补一个
      trimTrailingBlankLine();    // 去掉末尾那个多余的光标空行
      runBtn.disabled = false; stopBtn.disabled = true;
      if (m.ms) $("#timing").textContent = "耗时 " + m.ms + " ms";
      setStatus("就绪", "ok");
      $("#stdinPrompt").textContent = "›";
    } else if (m.type === "fatal") {
      running = false; runBtn.disabled = false; stopBtn.disabled = true;
      clearTimeout(runTimer); runTimer = null;
      setStatus("运行时错误", "err");
      append("\n[运行时错误] " + m.text + "\n", "o-err");
    } else if (m.type === "exit") {
      hardRestart(null);                            // SystemExit：内核已不可用，直接重建
    }
  };
  worker.onerror = (e) => {
    setLoad(null);
    running = false; runBtn.disabled = false; stopBtn.disabled = true;
    setStatus("Worker 启动失败", "err");
    append("\n[错误] 无法创建 Worker：" + (e.message || "") +
      "\n请改用本地服务器打开（运行 启动本地服务器.py），或换用 Chrome / Edge / Firefox 最新版。\n", "o-err");
  };

  if (HAS_SAB) {
    stdinSAB = new SharedArrayBuffer(16 + 8192);
    stdinCtrl = new Int32Array(stdinSAB);
    stdinBytes = new Uint8Array(stdinSAB);
    interruptBuf = new Int32Array(new SharedArrayBuffer(4));
  }
  setStatus("正在加载 Python 运行时…", "run");
  setLoad(-1);
  worker.postMessage({
    type: "init", indexURL: indexURL,
    stdinSAB: stdinSAB || null, interruptSAB: interruptBuf ? interruptBuf.buffer : null,
  });
}

async function boot() {
  buildEditor();
  if (HAS_SAB) { $("#prefillRow").classList.add("hidden"); }
  else { $("#liveRow").classList.add("hidden"); $("#prefillRow").classList.remove("hidden"); }
  $("#skipPreload").checked = localStorage.getItem("pyide.skipPreload") === "1";
  const savedTimeout = localStorage.getItem("pyide.timeout");
  if (savedTimeout) $("#timeoutSel").value = savedTimeout;

  let url = localStorage.getItem("pyide.src");
  if (!url || !SOURCES.some((s) => s.url === url)) {
    setStatus("正在探测可用的 CDN…", "run");
    url = await pickSource();
  }
  if (!url) {
    setStatus("无法连接 CDN", "err");
    append("⚠ 无法从任何 CDN 加载 Pyodide 运行时。请检查网络，或在 ⚙ 设置里填写自定义的运行时地址（例如下载 Pyodide 后本地自托管）。\n", "o-err");
    return;
  }
  localStorage.setItem("pyide.src", url);
  $("#sourceSel").value = SOURCES.some((s) => s.url === url) ? url : "custom";
  if (!SOURCES.some((s) => s.url === url)) $("#customUrl").value = url;
  /* 先把运行时主体拉一遍，好把「几十 MB 的空白等待」变成可见进度；
     之后 Pyodide 自己再取一遍时通常命中浏览器缓存，不会再产生实际流量。 */
  if (!$("#skipPreload").checked) await preloadRuntime(url);
  spawnWorker(url);
}

/* ---------- 运行 ---------- */
function runCode() {
  if (!ready || running) return;
  const code = getCode();
  if (!code.trim()) return;
  localStorage.setItem("pyide.code", code);
  running = true; awaitingInput = false;
  runBtn.disabled = true; stopBtn.disabled = false;   // 无 SAB 时也能「停止」（退化成重启内核）
  clearOutput();
  $("#timing").textContent = "";
  setStatus("运行中…", "run");
  armWatchdog();
  const lines = HAS_SAB ? [] : $("#stdinPrefill").value.split("\n");
  worker.postMessage({ type: "run", code: code, stdinLines: lines, mirror: $("#mirror").value });
}
/* 超时兜底：死循环 / 网络挂起时，页面不至于永远转圈 */
function armWatchdog() {
  clearTimeout(runTimer); runTimer = null;
  const ms = +($("#timeoutSel") ? $("#timeoutSel").value : 0);
  if (!ms) return;
  runTimer = setTimeout(() => {
    if (!running) return;
    append("\n⏱ 运行超过 " + (ms / 1000) + " 秒，正在中断…\n", "o-sys");
    stopRun(true);
  }, ms);
}

function sendStdin(text, eof) {
  if (!HAS_SAB) return;
  if (eof) { Atomics.store(stdinCtrl, 0, 2); }
  else {
    const bytes = new TextEncoder().encode(text);
    const n = Math.min(bytes.length, 8192 - 1);
    stdinBytes.set(bytes.subarray(0, n), 16);
    Atomics.store(stdinCtrl, 1, n);
    Atomics.store(stdinCtrl, 0, 1);
  }
  Atomics.notify(stdinCtrl, 0);
  $("#stdinInput").value = "";
  $("#stdinPrompt").textContent = "›";
}

function stopRun(auto) {
  if (!running) return;
  if (HAS_SAB) {
    Atomics.store(interruptBuf, 0, 2);           // SIGINT → KeyboardInterrupt
    Atomics.store(stdinCtrl, 0, 3); Atomics.notify(stdinCtrl, 0);
    append("\n^C 已请求中断（KeyboardInterrupt）\n", "o-sys");
    /* 兜底：C 扩展里的死循环可能吃不到 SIGINT，3 秒后直接重建内核 */
    clearTimeout(forceTimer);
    forceTimer = setTimeout(() => {
      if (running) hardRestart("中断无响应，已强制重启内核");
    }, 3000);
  } else {
    /* 降级：没有 SharedArrayBuffer 就发不出中断信号，只能终止 Worker 重建。
       代价是丢失全部变量，但比整页卡死强。 */
    hardRestart("当前环境不支持中断，已终止并重启内核");
  }
}
/* 彻底重建内核：终止旧 Worker、清空共享内存、重新加载 */
function hardRestart(reason) {
  clearTimeout(runTimer); runTimer = null;
  clearTimeout(forceTimer); forceTimer = null;
  if (worker) { worker.onmessage = null; worker.onerror = null; worker.terminate(); }
  worker = null; ready = false; running = false; awaitingInput = false;
  runBtn.disabled = true; stopBtn.disabled = true;
  setLoad(null);
  if (reason) append("\n⟳ " + reason + "，正在重新加载运行时…\n", "o-sys");
  stdinSAB = null; stdinCtrl = null; stdinBytes = null; interruptBuf = null;
  const url = localStorage.getItem("pyide.src") || SOURCES[0].url;
  spawnWorker(url);
}

    def __post_init__(self): self.items = self.items or []
    def push(self, x): self.items.append(x); return self
    def pop(self): return self.items.pop()

def fib():                       # 无限生成器
    a, b = 0, 1
    while True:
        yield a; a, b = b, a + b

@timer
def work():
    s = Stack(); [s.push(i) for i in range(5)]
    g = fib()
    return [next(g) for _ in range(10)], s.pop()

nums, top = work()
print("斐波那契前 10 项:", nums)
print("栈顶:", top)

# 异常处理
try:
    1 / 0
except ZeroDivisionError as e:
    print("捕获异常:", type(e).__name__, e)
finally:
    print("finally 总是执行")
` },
  { name: "⑧ 安装第三方包（micropip）", code: `# 纯 Python 包可用 micropip 从 PyPI 安装（含 C 扩展的包需 Pyodide 预编译）

  { name: "⑨ 异步与并发（asyncio）", code: `import asyncio, time

async def task(name, delay):
    print(f"{name} 开始")
    await asyncio.sleep(delay)
    print(f"{name} 结束（{delay}s）")
    return name.upper()

t0 = time.time()

/* ---------- 事件绑定 ---------- */
$("#examples").innerHTML += EXAMPLES.map((e, i) => `<option value="${i}">${e.name}</option>`).join("");
$("#examples").addEventListener("change", (e) => {
  const i = e.target.value;
  if (i === "") return;
  setCode(EXAMPLES[+i].code);
  localStorage.setItem("pyide.code", EXAMPLES[+i].code);
  e.target.value = "";
});
$("#sourceSel").innerHTML = SOURCES.map((s) => `<option value="${s.url}">${s.name}</option>`).join("") + '<option value="custom">自定义…</option>';

runBtn.addEventListener("click", runCode);
stopBtn.addEventListener("click", () => stopRun(false));
$("#clearBtn").addEventListener("click", () => { clearOutput(); $("#timing").textContent = ""; });
$("#stdinInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendStdin(e.target.value, false); });
$("#stdinEof").addEventListener("click", () => sendStdin("", true));
$("#pkgBtn").addEventListener("click", () => {
  const v = $("#pkgInput").value.trim();
  if (!v) return;
  const names = v.split(/[\s,]+/).filter(Boolean);
  runBtn.disabled = true; setStatus("安装中…", "run");
  running = true; stopBtn.disabled = false; armWatchdog();   // 装包也可能卡死，同样受超时保护
  append("$ micropip install " + names.join(" ") + "\n", "o-sys");
  worker.postMessage({ type: "install", names: names, mirror: $("#mirror").value });
});
$("#restartBtn").addEventListener("click", () => {
  clearOutput();
  hardRestart(null);
});
$("#themeBtn").addEventListener("click", () => {
  const light = document.documentElement.getAttribute("data-theme") === "light";
  document.documentElement.setAttribute("data-theme", light ? "" : "light");
  if (editor) editor.setOption("theme", light ? "monokai" : "default");
});
$("#setBtn").addEventListener("click", () => $("#settings").classList.toggle("open"));
$("#sourceSel").addEventListener("change", (e) => {
  let u = e.target.value;
  if (u === "custom") u = $("#customUrl").value.trim() || prompt("运行时地址（以 / 结尾，需包含 pyodide.js）:", "https://cdn.jsdelivr.net/pyodide/v0.29.4/full/");
  if (!u) { e.target.value = localStorage.getItem("pyide.src") || ""; return; }
  localStorage.setItem("pyide.src", u);
  $("#restartBtn").click();
});
$("#customUrl").addEventListener("change", (e) => {
  const u = e.target.value.trim();
  if (u) { localStorage.setItem("pyide.src", u); $("#restartBtn").click(); }
});
$("#timeoutSel").addEventListener("change", (e) => localStorage.setItem("pyide.timeout", e.target.value));
$("#skipPreload").addEventListener("change", (e) => localStorage.setItem("pyide.skipPreload", e.target.checked ? "1" : "0"));
$("#fontSel").addEventListener("change", (e) => {
  const size = e.target.value + "px";
  document.querySelectorAll(".CodeMirror").forEach((el) => (el.style.fontSize = size));
  if (!editor) $("#fallbackEditor").style.fontSize = size;
});
$("#mirror").value = localStorage.getItem("pyide.mirror") || "https://pypi.tuna.tsinghua.edu.cn/simple";
$("#mirror").addEventListener("change", () => localStorage.setItem("pyide.mirror", $("#mirror").value));
$("#saveBtn").addEventListener("click", () => {
  const blob = new Blob([getCode()], { type: "text/x-python;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "main.py"; a.click();
});
$("#fileBtn").addEventListener("click", () => $("#fileInput").click());
$("#fileInput").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { setCode(r.result); localStorage.setItem("pyide.code", r.result); };
  r.readAsText(f, "utf-8");
});

/* 分栏拖拽 */
(() => {
  const sp = $("#splitter"), left = $("#left"), main = $("main");
  let dragging = false;
  sp.addEventListener("mousedown", () => { dragging = true; document.body.style.userSelect = "none"; });
  window.addEventListener("mouseup", () => { dragging = false; document.body.style.userSelect = ""; });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const rect = main.getBoundingClientRect();
    const pct = Math.min(85, Math.max(15, ((e.clientX - rect.left) / rect.width) * 100));
    left.style.flex = "0 0 " + pct + "%";
  });
})();

window.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); runCode(); }
});

boot();
</script>
